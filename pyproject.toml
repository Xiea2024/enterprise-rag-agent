[project]
name = "enterprise-rag-agent"
version = "0.1.0"
description="Enterprise-oriented RAG and AI Agent backend"
readme="README.md"
requires-python=">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]


[tool.pytest.ini_options]
pythonpath =  ["."]
testpaths = ["tests"]